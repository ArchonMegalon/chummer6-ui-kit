name: UI Kit pull-request controls

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-and-consumers:
    name: Package, portability, and no-siblings consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.103
      - name: Verify checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up the pinned ripgrep verifier dependency
        shell: bash
        run: |
          rg_archive="${RUNNER_TEMP}/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz"
          rg_bin="${RUNNER_TEMP}/ripgrep-14.1.1-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz \
            --output "${rg_archive}"
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ${rg_archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${rg_archive}" --directory "${RUNNER_TEMP}" --no-same-owner
          chmod 0755 "${rg_bin}/rg"
          rg_version="$("${rg_bin}/rg" --version)"
          test "${rg_version%%$'\n'*}" = 'ripgrep 14.1.1 (rev 4649aa9700)'
          echo "${rg_bin}" >> "${GITHUB_PATH}"
      - name: Run default repo verification
        shell: bash
        run: bash scripts/ai/verify.sh
      - name: Verify pinned downstream authority integration
        shell: bash
        run: bash scripts/ai/verify_downstream_package_compatibility.sh
      - name: Recheck tracked source cleanliness
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

  dependency-review:
    name: Dependency vulnerability and package license review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.103
      - name: Reject vulnerable package graph or license drift
        shell: bash
        run: |
          dotnet list src/Chummer.Ui.Kit/Chummer.Ui.Kit.csproj package --vulnerable --include-transitive
          python3 scripts/ai/verify_package_hygiene.py \
            --repo-root . \
            --manifest tests/compatibility/downstream-pins.json
